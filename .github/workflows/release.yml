name: Build & Release Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version Shift
    runs-on: ubuntu-latest
    outputs:
      version_shifted: ${{ steps.check.outputs.version_shifted }}
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      release_title: ${{ steps.check.outputs.release_title }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check if version shifted
        id: check
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python scripts/check_version.py

  build-and-release:
    name: Build & Release Installer (Draft)
    needs: check-version
    if: needs.check-version.outputs.version_shifted == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer/src-tauri

      - name: Compile Hook & Proxy Binaries
        shell: cmd
        env:
          SKIP_TESTS: "1"
        run: scripts\build.bat

      - name: Build & Pack Installer
        shell: cmd
        run: scripts\build_installer.bat

      - name: Verify Installer Artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "bin/AffinityArabicSetup.exe")) {
            Write-Error "AffinityArabicSetup.exe not found in bin directory!"
            exit 1
          }
          $item = Get-Item "bin/AffinityArabicSetup.exe"
          $sizeMb = [math]::Round($item.Length / 1MB, 2)
          Write-Host "Installer built successfully: $($item.FullName) ($sizeMb MB)"

      - name: Create or Update Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          name: ${{ needs.check-version.outputs.release_title }}
          draft: true
          prerelease: false
          files: |
            bin/AffinityArabicSetup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
